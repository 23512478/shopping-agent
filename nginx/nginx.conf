# 生产 nginx 反代配置
# 证书挂载：宿主机 ./certs → 容器 /etc/nginx/certs（只读）
# 生产把 fullchain.pem / privkey.pem 放到 ./certs/ 目录即可

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # 限流：每 IP 每秒 10 请求，突发 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Docker 内置 DNS：用变量方式动态解析，后端暂时不在线 nginx 也能启动
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP → HTTPS 强制跳转
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt 验证目录保留
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- 后端 API：透传到 backend:8000（后端路由本身带 /api 前缀）----
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            set $backend "backend:8000";
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE / 长连接支持（chat/stream）
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- 健康检查（后端 /health 不在 /api 下）----
        location = /health {
            set $backend "backend:8000";
            proxy_pass http://$backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # ---- 前端静态资源（带 hash 的资源长缓存）----
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            set $frontend "frontend:80";
            proxy_pass http://$frontend$request_uri;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # ---- 前端页面 + SPA 路由（try_files 回退由前端容器自己处理）----
        location / {
            set $frontend "frontend:80";
            proxy_pass http://$frontend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
