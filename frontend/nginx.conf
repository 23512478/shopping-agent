# 前端容器内置 nginx：静态托管 + SPA 路由兜底
# 关键点：try_files 回退到 index.html，否则刷新 /search、/product/xxx 这类前端路由会 404
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 页面上的 /api 请求转给后端——页面的 fetch 走的是同源相对路径（/api/xxx），
    # 少了这段，容器会把 /api/search 也回落到 index.html，页面拿到 HTML 当 JSON 解析，
    # 结果就是「一片空白、没数据」。跟 vite.config.ts 开发模式里那条代理是同一个意思。
    # 生产环境外层 nginx 才是唯一入口（它自己转 /api/），这里多一层不冲突。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;   # AI 导购走 SSE，缓冲着就看不到流式输出
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store";   # 接口响应别让浏览器缓存，否则拿到旧 JSON
    }

    # 页面 + 前端路由统一回退到 index.html
    # index.html 明确不缓存：兜底会把它回给「没匹配上的路径」（改之前 /api/* 也走这条），
    # 一旦被浏览器缓存住，页面就会拿着 HTML 当接口响应解析，一直显示「数据源没接通」，
    # 非得强刷才好——线上排查过一次，这里钉死。带 hash 的 /assets/ 不受影响，照旧长缓存。
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}